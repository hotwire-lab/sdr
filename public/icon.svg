  <!-- Spectrum Fill & Trace -->
  <path
    d="M72 326 L108 320 L132 292 L154 322 L192 316 L218 282 L236 296 L256 176 L276 296 L294 280 L320 318 L358 310 L380 264 L404 318 L440 326 L440 338 L72 338 Z"
