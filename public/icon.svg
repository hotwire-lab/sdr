  />
  <path
    d="M72 326 L108 320 L132 292 L154 322 L192 316 L218 282 L236 296 L256 176 L276 296 L294 280 L320 318 L358 310 L380 264 L404 318 L440 326"
    fill="none"
    stroke="url(#sdrTrace)"
    stroke-width="20"
    stroke-linecap="round"
    stroke-linejoin="round"
  />

  <!-- Peak Carrier Marker -->
  <circle cx="256" cy="176" r="16" fill="#F85149" stroke="#0D1117" stroke-width="6" />

  <!-- Waterfall Heatmap Strip (Bottom) -->
  <g>
    <rect x="76" y="362" width="360" height="22" rx="6" fill="#0D2847" />
    <rect x="118" y="362" width="28" height="22" rx="4" fill="#1D4ED8" />
    <rect x="206" y="362" width="100" height="22" rx="4" fill="#0284C7" />
    <rect x="236" y="362" width="40" height="22" rx="4" fill="#F59E0B" />
