<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="sdrSpectrumFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.02" />
    </linearGradient>
    <linearGradient id="sdrTrace" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58A6FF" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#3FB950" />
    </linearGradient>
  </defs>

  <!-- HotWire Dark Frame -->
  <rect width="512" height="512" rx="112" fill="#0D1117" />
  <rect x="24" y="24" width="464" height="464" rx="96" fill="#161B22" stroke="#30363D" stroke-width="10" />

  <!-- Subtle RF Grid -->
  <g stroke="#21262D" stroke-width="4">
    <line x1="76" y1="220" x2="436" y2="220" />
    <line x1="76" y1="286" x2="436" y2="286" />
    <line x1="166" y1="120" x2="166" y2="338" />
    <line x1="256" y1="120" x2="256" y2="338" />
    <line x1="346" y1="120" x2="346" y2="338" />
  </g>

  <!-- RF Radio Wave Arcs (Top) -->
  <g fill="none" stroke-linecap="round">
    <path d="M214 148 A58 58 0 0 1 298 148" stroke="#38BDF8" stroke-width="14" opacity="0.9" />
    <path d="M182 120 A102 102 0 0 1 330 120" stroke="#58A6FF" stroke-width="12" opacity="0.55" />
