    <rect x="366" y="362" width="28" height="22" rx="4" fill="#0EA5E9" />

    <rect x="76" y="394" width="360" height="22" rx="6" fill="#0D2847" opacity="0.85" />
    <rect x="218" y="394" width="76" height="22" rx="4" fill="#0284C7" />
    <rect x="240" y="394" width="32" height="22" rx="4" fill="#F59E0B" />
    <rect x="248" y="394" width="16" height="22" rx="4" fill="#EF4444" />
    <rect x="368" y="394" width="24" height="22" rx="4" fill="#38BDF8" opacity="0.7" />
